<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM LOGIN // 访问认证</title>
    <style>
        :root {
            --bg-color: #050810;
            --cyan: #00f3ff;
            --dark-cyan: #0088cc;
            --text-color: #a0c0d0;
            --error-color: #ff0055;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            animation: gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        /* 扫描线遮罩 */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* 四角装饰 */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--cyan);
            opacity: 0.5;
            z-index: 1;
        }
        .tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(5, 8, 16, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
            z-index: 2;
            transition: 0.3s;
        }

        .container:hover {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--cyan);
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--cyan);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 12px;
            color: var(--dark-cyan);
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group label {
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* 入场动画 */
        .fade-in {
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        .btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            color: #fff;
            text-shadow: 0 0 5px var(--cyan);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
        }

        .footer a {
            color: var(--dark-cyan);
            text-decoration: none;
            transition: 0.3s;
        }

        .footer a:hover {
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }
    </style>
</head>
<body>
    <!-- 装饰角 -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="container">
        <div class="header fade-in">
            <h1>SYSTEM_LOGIN</h1>
            <p>[ 身份验证协议已就绪 ]</p>
        </div>

        <form action="/Login" method="POST" onsubmit="alert('登录验证通过！');">
            <div class="input-group fade-in delay-1">
                <label>USER_ID</label>
                <input type="text"     name="user" placeholder="请输入通行证ID" required autocomplete="off">
            </div>
            
            <div class="input-group fade-in delay-2">
                <label>PASSWORD</label>
                <input type="password" name="pass" placeholder="请输入安全密钥" required>
            </div>

            <button type="submit" class="btn fade-in delay-3">初始化连接</button>
        </form>

        <div class="footer fade-in delay-3">
            [ 未登记节点？ <a href="Register.html">在此注册</a> ]
            [  <a href="index.html">返回主页面</a> ]
        </div>
    </div>
</body>
</html>
