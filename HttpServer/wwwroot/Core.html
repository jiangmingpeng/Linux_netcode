<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心矩阵 // NEXUS</title>
    <style>
        /* CSS 基础配置与上一个文件相同 */
        :root {
            --bg-color: #050810; --cyan: #00f3ff; --purple: #9d4edd; --text-normal: #a0a5b0; --text-highlight: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.02); --card-border: rgba(0, 243, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body {
            background-color: var(--bg-color); color: var(--text-normal); min-height: 100vh;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; display: flex; flex-direction: column; align-items: center; padding-top: 40px; padding-bottom: 50px;
        }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%); background-size: 100% 4px; pointer-events: none; z-index: 999; }
        
        .tech-nav { display: flex; gap: 40px; margin-bottom: 50px; padding: 15px 40px; background: rgba(5, 8, 16, 0.9); border: 1px solid rgba(0, 243, 255, 0.1); border-radius: 4px; backdrop-filter: blur(10px); z-index: 10; }
        .nav-item { position: relative; text-decoration: none; color: var(--text-normal); font-size: 16px; letter-spacing: 2px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { color: var(--text-highlight); }
        .nav-item::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 20px; height: 3px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transform: scaleX(0); transform-origin: left; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item:hover::after, .nav-item.active::after { transform: scaleX(1); }

        .container { width: 100%; max-width: 1200px; padding: 0 20px; }
        .section-title { font-size: 20px; color: var(--cyan); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: '///'; color: var(--purple); }
        
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 25px; backdrop-filter: blur(5px); }
        .card:hover { border-color: rgba(0, 243, 255, 0.4); box-shadow: 0 0 20px rgba(0, 243, 255, 0.05); }

        /* 数据指标网格 */
        .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .metric-card { text-align: center; padding: 20px; position: relative; overflow: hidden; }
        .metric-card::before, .metric-card::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--cyan); }
        .metric-card::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .metric-card::after { bottom: 0; right: 0; border-left: none; border-top: none; }
        .metric-value { font-size: 32px; font-weight: bold; color: var(--cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); margin-bottom: 5px; }
        .metric-label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .metric-bar { width: 100%; height: 4px; background: #111; margin-top: 15px; border-radius: 2px; overflow: hidden; }
        .metric-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); }

        /* 下方双栏布局 */
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* CSS 动态柱状图 */
        .chart-container { height: 200px; display: flex; align-items: flex-end; gap: 5px; padding-top: 20px; border-bottom: 1px solid #333; }
        .bar { flex: 1; background: rgba(0, 243, 255, 0.2); border-top: 2px solid var(--cyan); transition: height 0.3s; position: relative; }
        .bar::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, transparent, rgba(0,243,255,0.8)); opacity: 0; transition: 0.3s; }
        .bar:hover::after { opacity: 1; }

        /* 滚动日志 */
        .log-container { height: 200px; overflow-y: auto; font-size: 13px; padding-right: 10px; }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: var(--cyan); }
        .log-line { margin-bottom: 8px; line-height: 1.4; }
        .log-time { color: #666; margin-right: 10px; }
        .log-info { color: #00f3ff; }
        .log-warn { color: #ffcc00; }
        .log-error { color: #ff0055; }
    </style>
</head>
<body>
    <nav class="tech-nav">
        <a href="architecture.html" class="nav-item">技术架构</a>
        <a href="matrix.html" class="nav-item active">核心矩阵</a>
        <a href="nodes.html" class="nav-item">接入节点</a>
    </nav>

    <div class="container">
        <h2 class="section-title">系统实时算力监控</h2>
        
        <!-- 顶部指标卡 -->
        <div class="metric-grid">
            <div class="card metric-card">
                <div class="metric-value" id="val-cpu">84.2%</div>
                <div class="metric-label">CPU 负载</div>
                <div class="metric-bar"><div class="metric-fill" style="width: 84%;"></div></div>
            </div>
            <div class="card metric-card">
                <div class="metric-value" id="val-mem">62.5%</div>
                <div class="metric-label">内存占用</div>
                <div class="metric-bar"><div class="metric-fill" style="width: 62%; background: linear-gradient(90deg, #00f3ff, #00ff66);"></div></div>
            </div>
            <div class="card metric-card">
                <div class="metric-value" id="val-net">1.2Tb</div>
                <div class="metric-label">网络吞吐</div>
                <div class="metric-bar"><div class="metric-fill" style="width: 70%; background: linear-gradient(90deg, #9d4edd, #ff00ea);"></div></div>
            </div>
            <div class="card metric-card">
                <div class="metric-value" style="color: #00ff66; text-shadow: 0 0 10px #00ff66;">0.02ms</div>
                <div class="metric-label">平均延迟</div>
                <div class="metric-bar"><div class="metric-fill" style="width: 10%; background: #00ff66;"></div></div>
            </div>
        </div>

        <!-- 下方图表和日志 -->
        <div class="bottom-grid">
            <div class="card">
                <h2 class="section-title" style="font-size: 16px;">实时流量波形 (QPS)</h2>
                <div class="chart-container" id="chart">
                    <!-- JS 会在这里生成柱子 -->
                </div>
            </div>

            <div class="card">
                <h2 class="section-title" style="font-size: 16px;">系统核心日志流</h2>
                <div class="log-container" id="log-box">
                    <div class="log-line"><span class="log-time">[10:42:01]</span><span class="log-info">[INFO] Nginx reloaded successfully.</span></div>
                    <div class="log-line"><span class="log-time">[10:42:05]</span><span class="log-info">[INFO] New node joined the cluster: Shanghai-02</span></div>
                    <div class="log-line"><span class="log-time">[10:43:12]</span><span class="log-warn">[WARN] High memory usage detected on worker-04 (85%)</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 指标数字跳动特效
        setInterval(() => {
            document.getElementById('val-cpu').innerText = (70 + Math.random() * 20).toFixed(1) + '%';
            document.getElementById('val-mem').innerText = (50 + Math.random() * 20).toFixed(1) + '%';
            document.getElementById('val-net').innerText = (1.0 + Math.random() * 0.8).toFixed(2) + 'Tb';
        }, 1500);

        // 2. 动态柱状图生成
        const chart = document.getElementById('chart');
        for (let i = 0; i < 30; i++) {
            let bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = Math.random() * 100 + '%';
            chart.appendChild(bar);
        }
        
        // 随机改变柱状图高度模拟实时流量
        setInterval(() => {
            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => {
                if(Math.random() > 0.7) {
                    bar.style.height = Math.random() * 100 + '%';
                }
            });
        }, 800);

        // 3. 滚动日志动态生成
        const logBox = document.getElementById('log-box');
        const logTemplates = [
            '<span class="log-info">[INFO] Health check passed for all pods.</span>',
            '<span class="log-info">[INFO] Cache invalidated: /api/v1/user/*</span>',
            '<span class="log-warn">[WARN] Rate limit reached for IP 192.168.x.x</span>',
            '<span class="log-error">[ERROR] Connection timeout to DB-Replica-02!</span>',
            '<span class="log-info">[INFO] Auto-scaling triggered: adding 2 nodes.</span>'
        ];

        setInterval(() => {
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            const randomLog = logTemplates[Math.floor(Math.random() * logTemplates.length)];
            
            const newLine = document.createElement('div');
            newLine.className = 'log-line';
            newLine.innerHTML = `<span class="log-time">${timeStr}</span>${randomLog}`;
            
            logBox.appendChild(newLine);
            logBox.scrollTop = logBox.scrollHeight; // 自动滚动到底部

            // 保持日志数量，防止内存泄漏
            if (logBox.children.length > 20) {
                logBox.removeChild(logBox.firstChild);
            }
        }, 2000);
    </script>
</body>
</html>
